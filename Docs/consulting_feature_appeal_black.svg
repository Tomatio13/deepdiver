<svg width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&amp;display=swap');
      /* Dark Mode Palette */
      .title { font-family: 'Noto Sans JP', sans-serif; font-weight: 700; font-size: 42px; fill: #FFFFFF; }
      .subtitle { font-family: 'Noto Sans JP', sans-serif; font-weight: 400; font-size: 24px; fill: #CCCCCC; }
      .section-title { font-family: 'Noto Sans JP', sans-serif; font-weight: 700; font-size: 28px; fill: #66B2FF; }
      .card-title { font-family: 'Noto Sans JP', sans-serif; font-weight: 700; font-size: 20px; fill: #FFFFFF; }
      .card-text { font-family: 'Noto Sans JP', sans-serif; font-weight: 400; font-size: 16px; fill: #DDDDDD; }
      .step-num { font-family: 'Noto Sans JP', sans-serif; font-weight: 700; font-size: 32px; fill: #FFFFFF; }
      .highlight-text { font-family: 'Noto Sans JP', sans-serif; font-weight: 700; font-size: 18px; fill: #FFFFFF; }
    </style>
    <!-- Arrow Marker (Light Blue for Dark Mode) -->
    <marker id="arrow-dark" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#66B2FF" />
    </marker>
  </defs>

  <!-- Background (Dark Gray) -->
  <rect x="0" y="0" width="1280" height="720" fill="#121212" />

  <!-- Header -->
  <rect x="0" y="0" width="1280" height="100" fill="#1E1E1E" />
  <text x="50" y="60" class="title">FUJITSU DDM-AWord CLI</text>
  <text x="600" y="60" class="subtitle">認知科学と統計的検証に基づく自律型経営支援エージェント</text>
  <line x1="50" y1="100" x2="1230" y2="100" stroke="#66B2FF" stroke-width="4" />

  <!-- Section 1: 3 Core Pillars -->
  <g transform="translate(50, 130)">
    <!-- Pillar 1 -->
    <rect x="0" y="0" width="380" height="100" rx="8" fill="#252525" stroke="#444444" stroke-width="1" />
    <rect x="0" y="0" width="10" height="100" rx="8" fill="#66B2FF" mask="url(#mask-left)" /> <!-- Accent Bar -->
    <text x="25" y="35" class="card-title" fill="#66B2FF">能動的課題発見</text>
    <text x="25" y="65" class="card-text">ユーザーが問う前にAIがデータをスキャンし、<tspan x="25" dy="24">潜在的な経営課題（仮説）を自ら提案</tspan></text>

    <!-- Pillar 2 -->
    <rect x="400" y="0" width="380" height="100" rx="8" fill="#252525" stroke="#444444" stroke-width="1" />
    <rect x="400" y="0" width="10" height="100" rx="8" fill="#66B2FF" />
    <text x="425" y="35" class="card-title" fill="#66B2FF">統計的検証とコード実行</text>
    <text x="425" y="65" class="card-text">Pythonコードを自ら設計・実行し、<tspan x="425" dy="24">データの裏付け（エビデンス）を確保</tspan></text>

    <!-- Pillar 3 -->
    <rect x="800" y="0" width="380" height="100" rx="8" fill="#252525" stroke="#444444" stroke-width="1" />
    <rect x="800" y="0" width="10" height="100" rx="8" fill="#66B2FF" />
    <text x="825" y="35" class="card-title" fill="#66B2FF">意思決定へのコミット</text>
    <text x="825" y="65" class="card-text">単なる分析ではなく、ROIを考慮した<tspan x="825" dy="24">「実行可能な戦略レポート」を生成</tspan></text>
  </g>

  <!-- Section 2: 5-Step Workflow -->
  <g transform="translate(50, 270)">
    <text x="0" y="0" class="section-title">自律型コンサルティング・ワークフロー</text>
    
    <!-- Flow Container -->
    <rect x="0" y="20" width="1180" height="200" rx="10" fill="#1E1E1E" stroke="#444444" stroke-width="1" />

    <!-- Step 1 -->
    <g transform="translate(30, 50)">
      <circle cx="40" cy="40" r="30" fill="#333333" stroke="#66B2FF" stroke-width="2" />
      <text x="40" y="52" text-anchor="middle" class="step-num">1</text>
      <text x="0" y="95" class="card-title" font-size="18">仮説立案</text>
      <text x="0" y="120" class="card-text" font-size="14">経営課題の探索</text>
      <text x="0" y="140" class="card-text" font-size="14">優先度定義</text>
    </g>
    <line x1="130" y1="90" x2="170" y2="90" stroke="#66B2FF" stroke-width="2" marker-end="url(#arrow-dark)" />

    <!-- Step 2 -->
    <g transform="translate(200, 50)">
      <circle cx="40" cy="40" r="30" fill="#333333" stroke="#66B2FF" stroke-width="2" />
      <text x="40" y="52" text-anchor="middle" class="step-num">2</text>
      <text x="0" y="95" class="card-title" font-size="18">データ加工</text>
      <text x="0" y="120" class="card-text" font-size="14">検証用データ抽出</text>
      <text x="0" y="140" class="card-text" font-size="14">Python生成・実行</text>
    </g>
    <line x1="300" y1="90" x2="340" y2="90" stroke="#66B2FF" stroke-width="2" marker-end="url(#arrow-dark)" />

    <!-- Step 3 -->
    <g transform="translate(370, 50)">
      <circle cx="40" cy="40" r="30" fill="#333333" stroke="#66B2FF" stroke-width="2" />
      <text x="40" y="52" text-anchor="middle" class="step-num">3</text>
      <text x="0" y="95" class="card-title" font-size="18">仮説検証</text>
      <text x="0" y="120" class="card-text" font-size="14">統計的判定</text>
      <text x="0" y="140" class="card-text" font-size="14">信頼度スコア算出</text>
    </g>
    <line x1="470" y1="90" x2="510" y2="90" stroke="#66B2FF" stroke-width="2" marker-end="url(#arrow-dark)" />

    <!-- Step 4 -->
    <g transform="translate(540, 50)">
      <circle cx="40" cy="40" r="30" fill="#333333" stroke="#66B2FF" stroke-width="2" />
      <text x="40" y="52" text-anchor="middle" class="step-num">4</text>
      <text x="0" y="95" class="card-title" font-size="18">戦略策定</text>
      <text x="0" y="120" class="card-text" font-size="14">解決策の立案</text>
      <text x="0" y="140" class="card-text" font-size="14">ROI/実現性評価</text>
    </g>
    <line x1="640" y1="90" x2="680" y2="90" stroke="#66B2FF" stroke-width="2" marker-end="url(#arrow-dark)" />

    <!-- Step 5 -->
    <g transform="translate(710, 50)">
      <circle cx="40" cy="40" r="30" fill="#333333" stroke="#66B2FF" stroke-width="2" />
      <text x="40" y="52" text-anchor="middle" class="step-num">5</text>
      <text x="0" y="95" class="card-title" font-size="18">レポート生成</text>
      <text x="0" y="120" class="card-text" font-size="14">成果の統合</text>
      <text x="0" y="140" class="card-text" font-size="14">プレゼン資料化</text>
    </g>

    <!-- Human in the Loop Badge -->
    <g transform="translate(900, 60)">
        <rect x="0" y="0" width="260" height="80" rx="8" fill="#CC7A00" /> <!-- Darker Orange for better contrast if needed, but standard orange is fine. Using slightly muted orange. -->
        <text x="130" y="30" text-anchor="middle" class="highlight-text" font-size="16">Human-in-the-Loop</text>
        <text x="130" y="60" text-anchor="middle" class="highlight-text" font-size="14">各ステップで人間の承認を経て</text>
        <text x="130" y="75" text-anchor="middle" class="highlight-text" font-size="14">ハルシネーションを防止</text>
    </g>
  </g>

  <!-- Section 3: Ensemble Method -->
  <g transform="translate(50, 520)">
    <text x="0" y="0" class="section-title">アンサンブル・コンサルティング方式</text>
    
    <g transform="translate(0, 20)">
        <!-- Box 1 -->
        <rect x="0" y="0" width="300" height="120" rx="8" fill="#252525" stroke="#66B2FF" stroke-width="1" stroke-dasharray="5,5" />
        <text x="150" y="30" text-anchor="middle" class="card-title" fill="#66B2FF">N個のプロジェクト並列実行</text>
        <text x="150" y="60" text-anchor="middle" class="card-text">異なるペルソナ・視点</text>
        <text x="150" y="80" text-anchor="middle" class="card-text">多様な仮説生成</text>
        
        <text x="330" y="65" font-size="30" fill="#66B2FF">➡</text>

        <!-- Box 2 -->
        <rect x="380" y="0" width="300" height="120" rx="8" fill="#252525" stroke="#66B2FF" stroke-width="1" />
        <text x="150" y="30" text-anchor="middle" class="card-title" fill="#66B2FF" transform="translate(380,0)">相互評価・ランキング</text>
        <text x="150" y="60" text-anchor="middle" class="card-text" transform="translate(380,0)">論理的整合性チェック</text>
        <text x="150" y="80" text-anchor="middle" class="card-text" transform="translate(380,0)">インパクト評価</text>

        <text x="710" y="65" font-size="30" fill="#66B2FF">➡</text>

        <!-- Box 3 (Result) -->
        <rect x="760" y="0" width="420" height="120" rx="8" fill="#0055AA" /> <!-- Brighter Blue fill -->
        <text x="210" y="40" text-anchor="middle" class="highlight-text" font-size="24" transform="translate(760,0)">Master Report</text>
        <text x="210" y="75" text-anchor="middle" class="highlight-text" font-size="16" transform="translate(760,0)">「最強の仮説」のみを統合した</text>
        <text x="210" y="95" text-anchor="middle" class="highlight-text" font-size="16" transform="translate(760,0)">最高品質の戦略レポート</text>
    </g>
  </g>

  <!-- Footer -->
  <rect x="0" y="680" width="1280" height="40" fill="#000000" />
  <text x="1250" y="705" text-anchor="end" font-family="Noto Sans JP" font-size="14" fill="#888888">Powered by AWS Strands Agent &amp; Spec-Driven Development</text>
</svg>
